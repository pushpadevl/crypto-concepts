<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Treemap</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color:transparent;
      font-family: system-ui, sans-serif;
    }
    #chart {
      width: 100%;
      height: 100%;
    }
    .tooltip {
      color: #343433;
    }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    async function loadData() {
      const response = await fetch('./topics.json');
      const data = await response.json();
      return transformData(data);
    }

    function transformData(data) {
      // Convert the JSON to ECharts treemap-compatible structure
      const topics = Object.values(data).map(topic => ({
        name: topic.name,
        children: topic.subtopics.map(sub => ({
          name: sub.name,
          children: sub.files.map(f => ({
            name: f.name,
            value: 1,
            path: f.path || f.htmlPath || f.mdPath || "",
            caption: f.caption || "",
            thumbnail: f.thumbnail || "",
            tags: f.tags || ""
          }))
        }))
      }));
      return topics;
    }

    loadData().then(dataset => {
      const chart = echarts.init(document.getElementById('chart'));

      const option = {
        backgroundColor: 'transparent',
color: [
            // vibrant neon
            '#7C4DFF', // violet
            '#FF4081', // pink
            '#FF9100', // orange
            '#FF5252', // coral red
            '#103407', // mint
            '#536DFE',  // indigo
            '#FFD740', // amber
            '#00E5FF', // cyan
            '#44C4FF', // sky blue
            '#34CFAA', // aqua green
            
      ],
        tooltip: {
          formatter: function (info) {
            const data = info.data;
            return `
              <div class="tooltip">
                <strong>${data.name}</strong><br/>
                ${data.caption ? data.caption + "<br/>" : ""}
                ${data.tags ? "<em>" + data.tags + "</em>" : ""}
              </div>
            `;
          }
        },
        series: [
          {
            type: 'treemap',
            roam: false,
            nodeClick: 'link',
            label: {
              show: true,
              formatter: '{b}',
              color: '#fff',
              fontSize: 12
            },
            breadcrumb: { show: false },
            upperLabel: {
              show: true,
              height: 30,
              color: '#fff',
              backgroundColor: 'transparent',
              fontSize: 14
            },
            itemStyle: {
              borderColor:'rgb(5,5,5,0.1)',
              borderWidth: 1,
              gapWidth: 2,
              
            },
            data: dataset,
            levels: [
              {
                itemStyle: {
                  borderColor: 'transparent',
                  borderWidth: 2,
                  gapWidth: 20,
                  
                },
                colorSaturation: [0.3, 0.5]
              },
              {
                colorSaturation: [0.4, 0.6]
              },
              {
                colorSaturation: [0.5, 0.7]
              }
            ]
          }
        ]
      };

      chart.setOption(option);

      // Click event to open the file if available
      chart.on('click', function (params) {
        if (params.data && params.data.path) {
          window.open(params.data.path, '_blank');
        }
      });

      window.addEventListener('resize', chart.resize);
    });
  </script>
</body>
</html>
