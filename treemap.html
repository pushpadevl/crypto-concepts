<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Treemap</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color:transparent;
      font-family: system-ui, sans-serif;
    }
    #chart {
      width: 100%;
      height: 100%;
    }
    .tooltip {
      color: #343433;
    }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    async function loadData() {
      const response = await fetch('./topics.json');
      const data = await response.json();
      return transformData(data);
    }

    function transformData(data) {
      // Convert the JSON to ECharts treemap-compatible structure and preserve keys/indexes
      const topics = Object.entries(data).map(([topicKey, topic]) => ({
    name: topic.name,
    topicKey: topicKey,
    children: (topic.subtopics || []).map((sub, subIndex) => ({
      name: sub.name,
      topicKey: topicKey,
      subIndex: subIndex,
      children: (sub.files || []).map(f => ({
        name: f.name,
        value: 1,
        topicKey: topicKey,
        subIndex: subIndex,
        file: f,
        path: f.path || f.htmlPath || f.mdPath || "",
        caption: f.caption || "",
        thumbnail: f.thumbnail || "",
        tags: f.tags || ""
      }))
    }))
  }));
      return topics;
    }

    loadData().then(dataset => {
      const chart = echarts.init(document.getElementById('chart'));

      const option = {
        backgroundColor: 'transparent',
        color: [
            // vibrant neon
            '#7C4DFF', // violet
            '#FF4081', // pink
            '#FF9100', // orange
            '#FF5252', // coral red
            '#103407', // mint
            '#536DFE',  // indigo
            '#FFD740', // amber
            '#00E5FF', // cyan
            '#44C4FF', // sky blue
            '#34CFAA', // aqua green
            
      ],
        tooltip: {
          formatter: function (info) {
            const data = info.data;
            return `
              <!--<div class="tooltip">-->
              <div class="max-width:320px">
                <strong>${data.name}</strong><br/>
                ${data.caption ? data.caption + "<br/>" : ""}
                ${data.tags ? "<em>" + data.tags + "</em>" : ""}
              </div>
            `;
          }
        },
        series: [
          {
            type: 'treemap',
            roam: false,
            nodeClick: 'zoomToNode',
            label: {
              show: true,
              formatter: '{b}',
              color: '#fff',
              fontSize: 14,
              overflow:'break',
              position: 'inside',
              // trim long names visually if still necessary
              ellipsis: true,
              // keep label visible on emphasis too
              emphasis: { show: true, fontSize: 15 },
              
            },
            breadcrumb: { show: true},
            upperLabel: {
              show: true,
              height: 20,
              color: '#fff',
              backgroundColor: 'transparent',
              fontSize: 16,
              
            },
            itemStyle: {
              borderColor:'rgb(5,5,5,0.1)',
              borderWidth: 1,
              gapWidth: 2,
              
            },
            data: dataset,
            levels: [
              {
                itemStyle: {
                  borderColor: 'transparent',
                  borderWidth: 2,
                  gapWidth: 20,
                },
                colorSaturation: [0.3, 0.5]
              },
              {
                itemStyle: {
                  borderColor: 'transparent',
                  borderWidth: 2,
                  gapWidth: 8
                },
                colorSaturation: [0.4, 0.6]
              },
              {
                colorSaturation: [0.5, 0.7]
              }
            ]
          }
        ]
      };

      chart.setOption(option);

      // Click event to open the file if available
      chart.on('click', function (params) {
        console.log('treemap click', params);
        const data = params.data || {};
        const nodeLevel = Array.isArray(params.treePathInfo) ? params.treePathInfo.length - 1 : null;
        
        // Only send navigation message for leaf nodes (level 2)
        if (nodeLevel === 3) {
          const payload = {
            type: 'treemapNavigation',
            topicKey: data.topicKey,
            subIndex: data.subIndex,
            file: data.file,
            nodeLevel: nodeLevel,
            isLeafNode: true  // Flag to indicate this is a file node
          };
          
          // Send message to parent
          window.parent.postMessage(payload, '*');
        }
        
        // Allow zooming for non-leaf nodes
        if (nodeLevel <1) {
          chart.dispatchAction({
            type: 'treemapZoomToNode',
            seriesIndex: 0,
            dataIndex: params.dataIndex
          });
        }
      });

      // Add zoom out handler for breadcrumb
      chart.on('treemapRootToNode', function() {
        // Clear any stored navigation state when zooming out
        window.parent.postMessage({
          type: 'treemapNavigation',
          topicKey: null,
          subIndex: null,
          file: null,
          nodeLevel: null
        }, '*');
      });

      window.addEventListener('resize', chart.resize);
    });
  </script>
</body>
</html>
